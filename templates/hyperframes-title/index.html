<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* EDIT THESE: colours come from characters/style-sheet.md */
      :root {
        --bg-a: #1b1f3a;
        --bg-b: #3a2c6b;
        --accent: #ffb347;
        --ink: #ffffff;
        --font-display: "DejaVu Sans", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 30% 30%, var(--bg-b), var(--bg-a) 70%);
      }
      #root {
        width: 100%; height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; font-family: var(--font-display);
      }
      #card { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #kicker {
        color: var(--accent); font-size: 40px; font-weight: 700;
        letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 28px;
      }
      #title {
        color: var(--ink); font-size: 120px; font-weight: 800; letter-spacing: -0.02em;
        text-align: center; max-width: 1600px; line-height: 1.05;
        text-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      #bar { width: 0; height: 10px; border-radius: 5px; background: var(--accent); margin-top: 40px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4"
         data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <!-- EDIT THESE two lines -->
        <div id="kicker">KICKER TEXT</div>
        <h1 id="title">Video Title Goes Here</h1>
        <div id="bar"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kicker", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#title", { opacity: 0, y: 50, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power4.out" }, 0.35);
      tl.to("#bar", { width: 420, duration: 0.8, ease: "power2.inOut" }, 0.9);
      tl.to("#card", { opacity: 0, duration: 0.5, ease: "power1.in" }, 3.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
