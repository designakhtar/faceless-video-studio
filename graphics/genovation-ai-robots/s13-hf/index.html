<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:"Hind Siliguri";font-weight:400;src:url(fonts/hs-lat-400.woff2) format("woff2");}
@font-face{font-family:"Hind Siliguri";font-weight:700;src:url(fonts/hs-lat-700.woff2) format("woff2");}
:root{--bg-a:#050814;--bg-b:#0E1A3A;--accent:#2F6BFF;--hi:#7FB2FF;--ink:#fff;--mute:#AAB6D3;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--bg-b),var(--bg-a) 72%);}
#root{width:100%;height:100%;font-family:"Hind Siliguri",sans-serif;color:var(--ink);}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
#glow{position:absolute;width:1100px;height:1100px;border-radius:50%;left:410px;top:-10px;background:radial-gradient(circle,rgba(47,107,255,.22),transparent 62%);}
#streak{position:absolute;left:-600px;top:540px;width:600px;height:4px;background:linear-gradient(90deg,transparent,var(--hi),transparent);}
.serif{font-family:"Liberation Serif","DejaVu Serif",serif;font-style:italic;font-weight:400;letter-spacing:-.01em;}
.kicker{color:var(--hi);font-size:30px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;}
.big{font-size:130px;line-height:1.02;}
.sub{color:var(--mute);font-size:40px;}
.btn{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:22px 56px;font-size:46px;font-weight:700;box-shadow:0 18px 60px rgba(47,107,255,.45);}
.tag{display:inline-block;border:2px solid rgba(127,178,255,.5);border-radius:999px;padding:10px 30px;font-size:28px;color:var(--hi);}

.scene{position:absolute;left:0;right:0;top:70px;height:760px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.row{display:flex;gap:40px;align-items:center;justify-content:center;}
.pill{border:2px solid rgba(127,178,255,.45);border-radius:20px;padding:22px 34px;background:rgba(14,26,58,.7);font-size:38px;}
.lbl{color:var(--hi);font-size:26px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-top:14px;}
.ring{position:absolute;border:4px solid var(--hi);border-radius:50%;opacity:0;}
.coin{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE89A,#E0A82E 60%,#8C6210);box-shadow:0 0 18px rgba(255,200,80,.5);}
.panel{border:2px solid rgba(127,178,255,.5);border-radius:26px;background:rgba(14,26,58,.85);box-shadow:0 30px 90px rgba(47,107,255,.35);}
.bubble{border-radius:30px;padding:26px 40px;font-size:44px;max-width:1100px;}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.467" data-width="1920" data-height="1080">
<div id="glow" class="clip" data-start="0" data-duration="4.467" data-track-index="0"></div>
<div id="streak" class="clip" data-start="0" data-duration="4.467" data-track-index="1"></div>
<div id="card" class="clip" data-start="0" data-duration="4.467" data-track-index="2">
<div class="scene"><div class="row" style="gap:120px">
<div style="text-align:center"><div class="serif" id="n" style="font-size:260px;line-height:1;color:#FFD36B">30</div><div class="lbl">days to live</div></div>
<div id="vs" style="font-size:60px;color:var(--mute)">·</div>
<div style="text-align:center"><div class="serif" id="s" style="font-size:110px;line-height:1.1">Less than<br>one salary</div></div></div></div>
</div></div>
<script>
const D=4.467;
const tl=gsap.timeline({paused:true});
tl.fromTo("#glow",{scale:.85,opacity:.5},{scale:1.12,opacity:1,duration:D,ease:"sine.inOut"},0);
tl.fromTo("#streak",{x:0},{x:3200,duration:1.1,ease:"power2.inOut"},0);
tl.fromTo("#card",{scale:1},{scale:1.04,duration:D,ease:"none"},0);
const IN=(sel,t,y=40)=>tl.fromTo(sel,{opacity:0,y:y},{opacity:1,y:0,duration:.6,ease:"power3.out"},t);
tl.fromTo("#n",{opacity:0,scale:.6},{opacity:1,scale:1,duration:.7,ease:"back.out(1.6)"},.2); IN("#vs",1.0); IN("#s",1.4);
tl.to("#card",{opacity:0,duration:.3,ease:"power1.in"},D-0.35);
window.__timelines["main"]=tl; tl.seek(0);
</script></body></html>
